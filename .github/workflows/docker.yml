name: Build & publish Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t jaksense:ci .

      - name: Smoke test (health check & halaman utama)
        run: |
          docker run -d --name jaksense -p 8080:8080 jaksense:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "JakSense"
          docker rm -f jaksense

      - name: Login ke GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push
        if: github.event_name != 'pull_request'
        run: |
          IMG=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag jaksense:ci $IMG:latest
          docker tag jaksense:ci $IMG:${GITHUB_SHA::7}
          docker push $IMG:latest
          docker push $IMG:${GITHUB_SHA::7}
